name: fastbid-paper
services:
  dashboard:
    build:
      context: ./client
      dockerfile: Dockerfile.paper
    ports:
      - "127.0.0.1:${FASTBID_PAPER_PORT:-8080}:8080"
    environment:
      FASTBID_WS_HOST: 0.0.0.0
      FASTBID_ALLOWED_ORIGINS: http://localhost:${FASTBID_PAPER_PORT:-8080},http://127.0.0.1:${FASTBID_PAPER_PORT:-8080}
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
  engine:
    build: ./server
    network_mode: service:dashboard
    depends_on:
      dashboard:
        condition: service_started
    environment:
      FASTBID_TCP_HOST: 127.0.0.1
      FASTBID_UDP_MCAST_ADDR: 127.0.0.1
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    stop_grace_period: 30s
